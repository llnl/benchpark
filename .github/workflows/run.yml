name: Run Benchpark and Simple Benchmark Suite
on:
  workflow_call:
    secrets:
      BENCHPARK_CODECOV_TOKEN:
        required: true
jobs:
  check_errors:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Benchpark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Add needed Python libs
        run: |
          pip install -r ./requirements.txt
      - name: Run negative tests via helper
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "TEST FAILED: $*" >&2; exit 1; }

          # run_expect_error "<name>" "<expected substring>" [VAR=VAL ...] [--] <cmd ...>
          run_expect_error() {
            local name="$1"; shift
            local expected="$1"; shift

            # collect VAR=VAL pairs (until optional --)
            local -a env_kv=()
            while [[ $# -gt 0 && "$1" == *=* ]]; do
              env_kv+=("$1")
              shift
            done
            [[ ${1-} == "--" ]] && shift
            set +e
            local stderr_output status
            if [[ ${#env_kv[@]} -gt 0 ]]; then
              stderr_output="$({ env "${env_kv[@]}" "$@" 1>/dev/null; } 2>&1)"
            else
              stderr_output="$({ "$@" 1>/dev/null; } 2>&1)"
            fi
            status=$?
            set -e
            [[ $status -ne 0 ]] || fail "$name: expected non-zero exit status, got $status"
            grep -Fq "$expected" <<<"$stderr_output" \
              && echo "$name: failed as expected: $expected" \
              || fail "$name: expected error message not found in stderr. got: $stderr_output"
          }

          # one-time setup
          ./bin/benchpark system init --dest dane llnl-cluster

          # 1) Non-MPIOnlyExperiment Test
          run_expect_error "Non-MPIOnlyExperiment Test" "cannot run with MPI only" \
            BENCHPARK_RUN_COVERAGE=errors -- \
            ./bin/benchpark experiment init --dest babelstream --system dane babelstream

          # 2) Multiple scaling options
          run_expect_error "Test multiple scaling options" "spec cannot specify multiple scaling options" \
            BENCHPARK_RUN_COVERAGE=errors2 -- \
            ./bin/benchpark experiment init --dest kripke --system dane kripke+strong+weak
      - name: Upload coverage to Codecov (errors)
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.BENCHPARK_CODECOV_TOKEN }}
          directory: ./coverage-data-errors
          flags: errors
          verbose: true
          fail_ci_if_error: true
      - name: Upload coverage to Codecov (errors2)
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.BENCHPARK_CODECOV_TOKEN }}
          directory: ./coverage-data-errors2
          flags: errors2
          verbose: true
          fail_ci_if_error: true
  saxpy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Benchpark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Add needed Python libs
        run: |
          pip install -r ./requirements.txt
      - name: Build Saxpy Workspace
        run: |
          ./bin/benchpark system init --dest=generic-x86 generic-x86
          ./bin/benchpark experiment init --dest=saxpy/openmp --system=generic-x86 saxpy+openmp
          ./bin/benchpark setup saxpy/openmp workspace/
      - name: Setup Ramble & Spack
        run: |
          . workspace/setup.sh
          spack mirror add ci-buildcache oci://ghcr.io/llnl/benchpark-binary-cache
          spack config add "packages:all:target:[x86_64_v3]"
          env | grep SPACK >> "$GITHUB_ENV"
          env | grep RAMBLE >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - name: Setup Saxpy Workspace
        working-directory: ./workspace/saxpy/openmp/generic-x86/workspace/
        run: |
          ramble \
            --workspace-dir . \
            --disable-logger \
            -c config:spack_flags:install:'--no-check-signature' \
            workspace setup
      - name: Run Saxpy Experiments
        working-directory: ./workspace/saxpy/openmp/generic-x86/workspace/
        run: |
          ramble \
            --workspace-dir . \
            --disable-logger \
            on \
            --executor '{execute_experiment}' \
            --where '{n_nodes} == 1'
      - name: Analyze Saxpy Results
        working-directory: ./workspace/saxpy/openmp/generic-x86/workspace/
        run: |
          ramble \
            --workspace-dir . \
            --disable-logger \
            workspace analyze
      - name: Archive Experiment Workspace
        working-directory: ./workspace/saxpy/openmp/generic-x86/workspace/
        if: always()
        run: |
          ramble \
            --workspace-dir . \
            --disable-logger \
            workspace archive
      - name: Upload Workspace Archive as CI Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-archive
          path: ./workspace/saxpy/openmp/generic-x86/workspace/archive/**
      - name: Upload Binaries to CI Cache
        if: github.ref == 'refs/heads/develop'
        run: |
          spack mirror set \
            --push \
            --oci-username ${{ github.actor }} \
            --oci-password "${{ secrets.GITHUB_TOKEN }}" \
            ci-buildcache
          spack buildcache push \
            -j $(($(nproc) + 1)) \
            --base-image ubuntu:24.04 \
            --unsigned \
            --update-index ci-buildcache \
            $(spack find --format '/{hash}')
      - name: Test Execution Using Binary
        run: |
          OUTPUT=$(spack find --paths saxpy)
          SAXPY_PATH=$(echo "$OUTPUT" | grep 'saxpy@' | awk '{print $2}')/bin/saxpy
          echo "Extracted Path: $SAXPY_PATH"
          BENCHPARK_RUN_COVERAGE=binary ./bin/benchpark experiment init --dest=saxpy/binary --system=generic-x86 saxpy+openmp package_manager="user-managed" append_path="$SAXPY_PATH"
          ./bin/benchpark setup saxpy/openmp workspace-binary/
          ./workspace-binary/ramble/bin/ramble \
            --workspace-dir \
            /home/runner/work/benchpark/benchpark/workspace-binary/saxpy/openmp/generic-x86/workspace \
            workspace setup
          ./workspace-binary/ramble/bin/ramble \
            --workspace-dir \
            /home/runner/work/benchpark/benchpark/workspace-binary/saxpy/openmp/generic-x86/workspace \
            on \
            --executor '{execute_experiment}' \
            --where '{n_nodes} == 1'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.BENCHPARK_CODECOV_TOKEN }}
          directory: ./coverage-data-binary
          flags: dryrunexperiments-binary
          verbose: true
          fail_ci_if_error: true
  dryrunexperiments:
    runs-on: ubuntu-24.04
    strategy:
      # Don't fail other running testtype tests
      fail-fast: false
      matrix:
        testtype:
          - cuda
          - rocm
          - openmp
          - mpi
          - strong
          - weak
          - throughput
          - modifiers
    steps:
      - name: Checkout Benchpark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Add needed Python libs
        run: |
          pip install -r ./requirements.txt
      - name: Run Dryruns
        run: |
          ./bin/benchpark bootstrap
          BENCHPARK_RUN_COVERAGE=${{ matrix.testtype }} ./bin/benchpark-python .github/utils/dryruns.py --test ${{ matrix.testtype }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.BENCHPARK_CODECOV_TOKEN }}
          directory: ./coverage-data-${{ matrix.testtype }}
          flags: dryrunexperiments-${{ matrix.testtype }}
          verbose: true
          fail_ci_if_error: true
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Benchpark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Add needed Python libs
        run: |
          pip install -r ./requirements.txt
      - name: Run
        run: |-
          ./bin/benchpark unit-test
