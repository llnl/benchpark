name: Run Benchpark and Simple Benchmark Suite
on:
  workflow_call:
jobs:
  saxpy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Benchpark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Add needed Python libs
        run: |
          pip install -r ./requirements.txt
      - name: Build Saxpy Workspace
        run: |
          ./bin/benchpark experiment init --dest=saxpy/openmp saxpy+openmp
          ./bin/benchpark system init --dest=generic-x86 generic-x86
          ./bin/benchpark setup saxpy/openmp generic-x86 workspace/
      - name: Setup Ramble & Spack
        run: |
          . workspace/setup.sh
          spack mirror add ci-buildcache oci://ghcr.io/llnl/benchpark-binary-cache
          spack config add "packages:all:target:[x86_64_v3]"
          env | grep SPACK >> "$GITHUB_ENV"
          env | grep RAMBLE >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - name: Setup Saxpy Workspace
        working-directory: ./workspace/saxpy/openmp/generic-x86/workspace/
        run: |
          ramble \
            --workspace-dir . \
            --disable-progress-bar \
            --disable-logger \
            -c config:spack_flags:install:'--no-check-signature' \
            workspace setup
      - name: Run Saxpy Experiments
        working-directory: ./workspace/saxpy/openmp/generic-x86/workspace/
        run: |
          ramble \
            --workspace-dir . \
            --disable-progress-bar \
            --disable-logger \
            on \
            --executor '{execute_experiment}' \
            --where '{n_nodes} == 1'
      - name: Analyze Saxpy Results
        working-directory: ./workspace/saxpy/openmp/generic-x86/workspace/
        run: |
          ramble \
            --workspace-dir . \
            --disable-progress-bar \
            --disable-logger \
            workspace analyze
      - name: Archive Experiment Workspace
        working-directory: ./workspace/saxpy/openmp/generic-x86/workspace/
        if: always()
        run: |
          ramble \
            --workspace-dir . \
            --disable-progress-bar \
            --disable-logger \
            workspace archive
      - name: Upload Workspace Archive as CI Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-archive
          path: ./workspace/saxpy/openmp/generic-x86/workspace/archive/**
      - name: Upload Binaries to CI Cache
        if: github.ref == 'refs/heads/develop'
        run: |
          spack mirror set \
            --push \
            --oci-username ${{ github.actor }} \
            --oci-password "${{ secrets.GITHUB_TOKEN }}" \
            ci-buildcache
          spack buildcache push \
            -j $(($(nproc) + 1)) \
            --base-image ubuntu:24.04 \
            --unsigned \
            --update-index ci-buildcache \
            $(spack find --format '/{hash}')
      - name: Test Execution Using Binary
        run: |
          OUTPUT=$(spack find --paths saxpy)
          SAXPY_PATH=$(echo "$OUTPUT" | grep 'saxpy@' | awk '{print $2}')/bin/saxpy
          echo "Extracted Path: $SAXPY_PATH"
          ./bin/benchpark experiment init --dest=saxpy/binary saxpy+openmp package_manager="user-managed" append_path="$SAXPY_PATH"
          ./bin/benchpark setup saxpy/openmp generic-x86 workspace-binary/
          ./workspace-binary/ramble/bin/ramble \
            --disable-progress-bar \
            --workspace-dir \
            /home/runner/work/benchpark/benchpark/workspace-binary/saxpy/openmp/generic-x86/workspace \
            workspace setup
          ./workspace-binary/ramble/bin/ramble \
            --disable-progress-bar \
            --workspace-dir \
            /home/runner/work/benchpark/benchpark/workspace-binary/saxpy/openmp/generic-x86/workspace \
            on \
            --executor '{execute_experiment}' \
            --where '{n_nodes} == 1'
  dryrunexperiments:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Benchpark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Add needed Python libs
        run: |
          pip install -r ./requirements.txt
      - name: Dry run amg2023/openmp on Dane with allocation modifier
        run: |
          ./bin/benchpark experiment init --dest=amg2023/openmp amg2023+openmp
          ./bin/benchpark system init --dest=dane llnl-cluster cluster=dane
          ./bin/benchpark setup amg2023/openmp dane workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/amg2023/openmp/dane/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run amg2023/cuda on Sierra with allocation modifier
        run: |
          ./bin/benchpark experiment init --dest=amg2023/cuda amg2023+cuda
          ./bin/benchpark system init --dest=llnl-sierra llnl-sierra
          ./bin/benchpark setup amg2023/cuda llnl-sierra workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/amg2023/cuda/llnl-sierra/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run dynamic kripke/openmp on generic-x86 with allocation modifier
        run: |
          ./bin/benchpark experiment init --dest=kripke/openmp kripke+openmp caliper=mpi,time
          ./bin/benchpark system init --dest=generic-x86 generic-x86
          ./bin/benchpark setup ./kripke/openmp generic-x86 workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/kripke/openmp/generic-x86/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run dynamic kripke/rocm on Tioga with allocation modifier
        run: |
          ./bin/benchpark experiment init --dest=kripke/rocm kripke+rocm
          ./bin/benchpark system init --dest=tioga llnl-elcapitan cluster=tioga
          ./bin/benchpark setup ./kripke/rocm tioga workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/kripke/rocm/tioga/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run dynamic kripke/rocm on Tuolumne SPX with allocation modifier
        run: |
          ./bin/benchpark system init --dest=tuolumne/spx llnl-elcapitan cluster=tuolumne gpumode=SPX
          ./bin/benchpark setup ./kripke/rocm tuolumne/spx workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/kripke/rocm/tuolumne/spx/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run dynamic kripke/rocm on Tuolumne TPX with allocation modifier
        run: |
          ./bin/benchpark system init --dest=tuolumne/tpx llnl-elcapitan cluster=tuolumne gpumode=TPX
          ./bin/benchpark setup ./kripke/rocm tuolumne/tpx workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/kripke/rocm/tuolumne/tpx/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run dynamic kripke/rocm on Tuolumne CPX with allocation modifier
        run: |
          ./bin/benchpark system init --dest=tuolumne/cpx llnl-elcapitan cluster=tuolumne gpumode=CPX
          ./bin/benchpark setup ./kripke/rocm tuolumne/cpx workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/kripke/rocm/tuolumne/cpx/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run kripke/cuda on Sierra with allocation modifier
        run: |
          ./bin/benchpark experiment init --dest=kripke/cuda kripke+cuda
          ./bin/benchpark setup kripke/cuda llnl-sierra workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/kripke/cuda/llnl-sierra/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run kripke/rocm on dynamic Tioga with allocation modifier
        run: |
          ./bin/benchpark system init --dest=tioga/rocm6.2.4-cce llnl-elcapitan rocm=6.2.4 compiler=cce ~gtl
          ./bin/benchpark setup kripke/rocm ./tioga/rocm6.2.4-cce workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir "workspace/kripke/rocm/tioga/rocm6.2.4-cce/workspace" \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run dynamic saxpy/rocm with static Tioga
        run: |
          ./bin/benchpark experiment init --dest=saxpy/rocm saxpy+rocm
          ./bin/benchpark setup ./saxpy/rocm tioga workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/saxpy/rocm/tioga/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run dynamic lammps/openmp on static Ruby
        run: |
          ./bin/benchpark experiment init --dest=lammps/openmp lammps+openmp
          ./bin/benchpark system init --dest=ruby llnl-cluster cluster=ruby
          ./bin/benchpark setup ./lammps/openmp ruby workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/lammps/openmp/ruby/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run dynamic lammps/rocm on static Tioga
        run: |
          ./bin/benchpark experiment init --dest=lammps/rocm lammps+rocm
          ./bin/benchpark setup ./lammps/rocm tioga workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/lammps/rocm/tioga/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run dynamic quicksilver/openmp on generic-x86 with allocation modifier
        run: |
          ./bin/benchpark experiment init --dest=quicksilver/openmp quicksilver+openmp +weak~single_node
          ./bin/benchpark setup ./quicksilver/openmp generic-x86 workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/quicksilver/openmp/generic-x86/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run qws/openmp with allocation modifier on Fugaku
        run: |
          ./bin/benchpark experiment init --dest=qws/openmp qws+openmp
          ./bin/benchpark system init --dest=riken-fugaku riken-fugaku
          ./bin/benchpark setup qws/openmp riken-fugaku workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/qws/openmp/riken-fugaku/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
            
      - name: Dry run qws/openmp with allocation modifier on generic-x86
        run: |
          ./bin/benchpark setup qws/openmp generic-x86 workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/qws/openmp/generic-x86/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run salmon/openmp with allocation modifier on generic-x86
        run: |
          ./bin/benchpark experiment init --dest=salmon/openmp salmon-tddft+openmp
          ./bin/benchpark setup salmon/openmp generic-x86 workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/salmon/openmp/generic-x86/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
      - name: Dry run salmon/openmp with allocation modifier on Fugaku
        run: |
          ./bin/benchpark setup salmon/openmp riken-fugaku workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir workspace/salmon/openmp/riken-fugaku/workspace \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
  dynamicdryrunexperiments:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Benchpark
