name: Run a Set of Tests to Collect Code Coverage for Benchpark
on:
  workflow_call:

jobs:
  run_unit_tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Benchpark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Add needed Python libs
        run: |
          pip install -r ./requirements.txt
      
      - name: Run unit tests with coverage
        run: |
          ./bin/benchpark unit-test --cov=./ --cov-report=xml --durations=20 -ra
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@13ce06bfc6bbe3ecf90edbbf1bc32fe5978ca1d3
        if: false  # Temporarily disable this step until Codecov side of this is available
        env:
          CODECOV_TOKEN: ${{ secrets.BENCHPARK_CODECOV_TOKEN }}
        with:
          directory: ./coverage/reports
          files: /home/runner/work/benchpark/benchpark/coverage.xml
          flags: unittests
          verbose: true
          fail_ci_if_error: true
        