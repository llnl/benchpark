name: Dynamic dry run template

on:
  workflow_call:
    inputs:
      benchmark_name:
        required: true
        type: string
      benchmark_mode:
        required: true
        type: string
      benchmark_spec:
        required: true
        type: string
      system_name:
        required: true
        type: string
      system_spec:
        required: true
        type: string
      name_suffix:
        default: ''
        required: false
        type: string

jobs:
  reusable_job:
    runs-on: ubuntu-22.04
    steps:
      - name: "Dry run dynamic ${{ inputs.benchmark_name }}-${{ inputs.benchmark_mode }} on ${{ inputs.system_name }} (${{ inputs.name_suffix }})"
        run: |
          timestamp=$(date +%s)
          bn="${{ inputs.benchmark_name }}"
          bm="${{ inputs.benchmark_mode }}"
          benchmark="$bn-$bm-$timestamp"
          sn="${{ inputs.system_name }}"
          system="$sn-$timestamp"
          ./bin/benchpark system init --dest=$system ${{ inputs.system_spec }}
          system_id=$(./bin/benchpark system id ./$system)
          ./bin/benchpark experiment init --dest=$benchmark ${{ inputs.benchmark_spec }}
          ./bin/benchpark setup ./$benchmark ./$system workspace/
          . workspace/setup.sh
          ramble \
            --workspace-dir "workspace/$benchmark/$system_id/workspace" \
            --disable-progress-bar \
            --disable-logger \
            workspace setup --dry-run
