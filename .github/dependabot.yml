version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: pip
    # Dependabot reads every requirements file in requirements/. The root
    # requirements.txt only includes these files and is not scanned.
    directory: /requirements
    # ramble.txt is copied from Ramble; keep it in sync with checkout-versions.yaml.
    exclude-paths: [requirements/ramble.txt]
    schedule:
      interval: weekly
    ignore:
      # Patch releases are too noisy. Security updates are still opened.
      - dependency-name: '*'
        update-types: [version-update:semver-patch]
      # jupyterhub is pinned intentionally. Security updates are still opened.
      - dependency-name: jupyterhub
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: docker
    # Updates the digest-pinned base image in the Flux container.
    directory: /containerfiles/flux/el10
    schedule:
      interval: weekly
