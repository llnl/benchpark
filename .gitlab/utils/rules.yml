.run_test_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $ADVANCED_JOB == "ON" && $CI_COMMIT_BRANCH
        != "main" && $CI_COMMIT_BRANCH != "develop" && $ALL_TARGETS != "ON"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE ==
        "push" && ($CI_COMMIT_BRANCH == "develop"))
      changes:
        - .gitlab-ci.yml
        - .gitlab/**/*
        - bin/**/*
        - '**/$BENCHMARK/**/*'
        - systems/$ARCHCONFIG/**/*
        - modifiers/**/*
        - var/**/*
        - lib/**/*
      when: on_success
