workflow:
  auto_cancel:
    on_new_commit: interruptible

.test_clusters: &test_clusters
  parallel:
    matrix:
      - HOST: tioga
        ARCHCONFIG: LLNL-Tioga-HPECray-zen3-MI250X-Slingshot
        RUN_PARAMS: -N 1 -t 1h
      - HOST: dane
        ARCHCONFIG: LLNL-Dane-DELL-sapphirerapids-OmniPath
        RUN_PARAMS: -N 1 -t 01:00:00
      - HOST: ruby
        ARCHCONFIG: LLNL-Ruby-icelake-OmniPath
        RUN_PARAMS: -N 1 -t 01:00:00

.test_benchmarks: &test_benchmarks
  parallel:
    matrix:
      - BENCHMARK:
          - kripke
          - saxpy

.on_machine:
  tags:
    - shell
    - $HOST
  <<: *test_clusters
  rules:
    # Only report failure if the pipeline failed.
    - if: '$CI_JOB_NAME =~ /status_failure/'
      when: on_failure
    # A true statement is expected to allow jobs to run. Here is the default.
    - when: on_success

.status_report: &status_report
    - export context=$HOST
    - |
      curl --url "https://api.github.com/repos/llnl/${CI_PROJECT_NAME}/statuses/${CI_COMMIT_SHA}" \
           --header 'Content-Type: application/json' \
           --header "authorization: Bearer ${GITHUB_TOKEN}" \
           --data "{ \"state\": \"${pipeline_status}\", \"target_url\": \"${CI_PIPELINE_URL}\", \"description\": \"GitLab ${context} pipeline\", \"context\": \"ci/gitlab/${context}\" }"

status_pending:
  extends: [.on_machine]
  stage: status_initiate
  id_tokens:
    CI_JOB_JWT:
      aud: https://lc.llnl.gov/gitlab
  script:
    - export pipeline_status="pending"
    - *status_report

status_success:
  extends: [.on_machine]
  stage: status_update
  script:
    - export pipeline_status="success"
    - *status_report
  when: on_success

status_failure:
  extends: [.on_machine]
  stage: status_update
  script:
    - export pipeline_status="failure"
    - *status_report
  when: on_failure

legacy_test_run:
  resource_group: $HOST
  stage: test
  tags:
    - $HOST
    - batch
  <<: *test_clusters
  variables:
    SCHEDULER_PARAMETERS: $RUN_PARAMS
  rules:
    - if: |
        $CI_PIPELINE_SOURCE == "merge_request_event" ||
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/*
        - experiments/**
        - systems/**
        - repo/**
        - modifiers/**
        - var/**
        - lib/**
  script:
    - . /usr/workspace/benchpark-dev/benchpark-venv/$SYS_TYPE/bin/activate
    # Build Saxpy Workspace
    - ./bin/benchpark setup saxpy/openmp $ARCHCONFIG workspace/
    # Setup Ramble & Spack
    - . workspace/setup.sh
    # Setup Saxpy Workspace
    - cd ./workspace/saxpy/openmp/$ARCHCONFIG/workspace/
    - ramble --workspace-dir . --disable-progress-bar --disable-logger workspace setup
    # Run Saxpy Experiments
    - ramble --workspace-dir . --disable-progress-bar --disable-logger
      on --executor '{execute_experiment}' --where '{n_nodes} == 1'
    # Analyze Experiments
    - ramble --workspace-dir . --disable-progress-bar workspace analyze --always-print-foms --format json yaml text
    # Check Experiment Exit Codes
    - cd -
    - python ./.gitlab/ci/bin/exit-codes ./workspace/saxpy/openmp/$ARCHCONFIG/workspace/results.latest.json

test_run_tioga_rocm:
  resource_group: $HOST
  stage: test
  tags:
    - tioga
    - batch
  variables:
    SCHEDULER_PARAMETERS: $RUN_PARAMS
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/*
        - experiments/**
        - systems/**
        - repo/**
        - modifiers/**
        - var/**
        - lib/**
  script:
    - . /usr/workspace/benchpark-dev/benchpark-venv/$SYS_TYPE/bin/activate
    # Initialize system & experiment
    - ./bin/benchpark system init --dest=tioga-system llnl-elcapitan ~gtl
    - system_id=$(./bin/benchpark system id ./tioga-system)
    - ./bin/benchpark experiment init --dest=${BENCHMARK}-benchmark ${BENCHMARK}+rocm
    # Build Workspace
    - ./bin/benchpark setup ${BENCHMARK}-benchmark tioga-system workspace/
    # Setup Ramble & Spack
    - . workspace/setup.sh
    # Setup Workspace
    - cd ./workspace/${BENCHMARK}-benchmark/${system_id}/workspace/
    - ramble --workspace-dir . --disable-progress-bar --disable-logger workspace setup
    # Run Experiments
    - ramble --workspace-dir . --disable-progress-bar --disable-logger
      on --executor '{execute_experiment}' --where '{n_nodes} == 1'
  <<: *test_benchmarks

test_run_kripke_openmp:
  resource_group: $HOST
  stage: test
  tags:
    - $HOST
    - batch
  <<: *test_clusters
  variables:
    SCHEDULER_PARAMETERS: $RUN_PARAMS
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/*
        - experiments/**
        - systems/**
        - repo/**
        - modifiers/**
        - var/**
        - lib/**
  script:
    - . /usr/workspace/benchpark-dev/benchpark-venv/$SYS_TYPE/bin/activate
    # Initialize system & experiment
    - |
        if [ "$HOST" == "tioga" ]; then
            ./bin/benchpark system init --dest=tioga-system llnl-elcapitan ~gtl
            system_id=$(./bin/benchpark system id ./tioga-system)
        else
            ./bin/benchpark system init --dest=$HOST-system llnl-cluster  cluster=$HOST
            system_id=$(./bin/benchpark system id ./$HOST-system)
        fi
    - ./bin/benchpark experiment init --dest=kripke-benchmark kripke+openmp
    # Build Workspace
    - ./bin/benchpark setup kripke-benchmark $HOST-system workspace/
    # Setup Ramble & Spack
    - . workspace/setup.sh
    # Setup Workspace
    - cd ./workspace/kripke-benchmark/${system_id}/workspace/
    - ramble --workspace-dir . --disable-progress-bar --disable-logger workspace setup
    # Run Experiments
    - ramble --workspace-dir . --disable-progress-bar --disable-logger
      on --executor '{execute_experiment}' --where '{n_nodes} == 1'
    # Analyze Experiments
    - ramble --workspace-dir . --disable-progress-bar workspace analyze --always-print-foms --format json yaml text
    # Check Experiment Exit Codes
    - cd -
    - python ./.gitlab/ci/bin/exit-codes ./workspace/kripke-benchmark/${system_id}/workspace/results.latest.json

