          --dest=lassen-system llnl-sierra]
.push_status: &push_status
  # Max job name length 140 characters
  - |
    TRUNCATED_JOB_NAME=$(echo "${CI_JOB_NAME}" | cut -c1-140)
    curl -X POST --url "https://api.github.com/repos/llnl/${CI_PROJECT_NAME}/statuses/${CI_COMMIT_SHA}" \
         --header 'Content-Type: application/json' \
         --header "authorization: Bearer ${GITHUB_TOKEN}" \
         --data "{ \"state\": \"${pipeline_status}\", \"target_url\": \"${CI_JOB_URL}\", \"description\": \"${TRUNCATED_JOB_NAME}\", \"context\": \"ci/gitlab/${CI_JOB_NAME}\" }"
.report_status: &report_status
  before_script:
    - export pipeline_status="pending"
    - *push_status
  after_script:
    - |
      if [[ "$CI_JOB_STATUS" == "failed" ]]; then
        export pipeline_status="failure"
        export EXIT_CODE=false
      else
        export pipeline_status="$CI_JOB_STATUS"
        export EXIT_CODE=true
      fi
      ctest -S CTestGitlab.cmake \
        -DHOST="${HOST}" \
        -DDASHBOARD_NAME="${DASHBOARD_NAME}" \
        -DBUILD_NAME="${HOST}/${BENCHMARK}${VARIANT}" \
        -DSITE="$(hostname)" \
        -DTEST_TYPE="${TEST_TYPE}" \
    - *push_status
workflow:
  auto_cancel:
    on_new_commit: conservative
test_run:
  resource_group: $HOST
  stage: test
  tags: [$HOST, batch]
  <<:
    - *test_clusters
    - *report_status
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/*
        - experiments/**
        - systems/$ARCHCONFIG/**
        - repo/$BENCHMARK/**
        - modifiers/**
        - var/**
        - lib/**
  script:
    # Activate Virtual Environment
    - . /usr/workspace/benchpark-dev/benchpark-venv/$SYS_TYPE/bin/activate
    # Initialize System
    - |
      EXTRA_ARGS=""
      if [ "$HOST" == "tioga" ]; then
          EXTRA_ARGS="~gtl"
      fi
      ./bin/benchpark system init --dest=${HOST}-system ${ARCHCONFIG} $EXTRA_ARGS
    # Initialize Experiment
    - ./bin/benchpark experiment init --dest=${BENCHMARK}-benchmark ${BENCHMARK}${VARIANT}
    # Build Workspace
    - ./bin/benchpark setup ${BENCHMARK}-benchmark ${HOST}-system workspace/
    # Setup Ramble & Spack
    - . workspace/setup.sh
    # Setup Workspace
    - cd ./workspace/${BENCHMARK}-benchmark/${HOST}-system/workspace/
    - ramble --workspace-dir . --disable-progress-bar --disable-logger workspace setup
    # Run Experiments
    - ramble --workspace-dir . --disable-progress-bar --disable-logger on --executor
      '{execute_experiment}' --where '{n_nodes} == 1'
    # Analyze Experiments
    - ramble --workspace-dir . --disable-progress-bar workspace analyze --format json
      yaml text
    # Check Experiment Exit Codes
    - cd -
    - python ./.gitlab/ci/bin/exit-codes ./workspace/${BENCHMARK}-benchmark/${HOST}-system/workspace/results.latest.json
