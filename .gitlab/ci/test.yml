.test_clusters: &test_clusters
  parallel:
    matrix:
      - HOST: tioga
        ARCHCONFIG: llnl-elcapitan
        SCHEDULER_PARAMETERS: -N 1 -t 20m
        BENCHMARK:
          - amg2023
          - kripke
          - saxpy
        VARIANT:
          - rocm
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: -N 1 -t 00:20:00
        BENCHMARK:
          - amg2023
          - kripke
          - saxpy
        VARIANT:
          - openmp
      - HOST: ruby
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: -N 1 -t 00:20:00
        BENCHMARK:
          - amg2023
          - kripke
          - saxpy
        VARIANT:
          - openmp

.push_status: &push_status
    - |
      curl -X POST --url "https://api.github.com/repos/llnl/${CI_PROJECT_NAME}/statuses/${CI_COMMIT_SHA}" \
           --header 'Content-Type: application/json' \
           --header "authorization: Bearer ${GITHUB_TOKEN}" \
           --data "{ \"state\": \"${pipeline_status}\", \"target_url\": \"${CI_JOB_URL}\", \"description\": \"${CI_JOB_NAME}\", \"context\": \"ci/gitlab/${CI_JOB_NAME}\" }"

.report_status: &report_status
  before_script:
    - export pipeline_status="pending"
    - *push_status
  after_script:
    - |
      if [[ "$CI_JOB_STATUS" == "failed" ]]; then
        export pipeline_status="failure"
      else
        export pipeline_status="$CI_JOB_STATUS"
      fi
    - *push_status

workflow:
  auto_cancel:
    on_new_commit: conservative

test_run:
  resource_group: $HOST
  stage: test
  tags:
    - $HOST
    - batch
  <<: *test_clusters
  <<: *report_status
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/*
        - experiments/**
        - systems/$ARCHCONFIG/**
        - repo/$BENCHMARK/**
        - modifiers/**
        - var/**
        - lib/**
  script:
    # Activate Virtual Environment
    - . /usr/workspace/benchpark-dev/benchpark-venv/$SYS_TYPE/bin/activate
    # Initialize System
    - |
        EXTRA_ARGS=""
        if [ "$HOST" == "tioga" ]; then
            EXTRA_ARGS="~gtl"
        fi
        ./bin/benchpark system init --dest=${HOST}-system ${ARCHCONFIG} cluster=$HOST $EXTRA_ARGS
    # Initialize Experiment
    - ./bin/benchpark experiment init --dest=${BENCHMARK}-benchmark ${BENCHMARK}+${VARIANT}
    # Build Workspace
    - ./bin/benchpark setup ${BENCHMARK}-benchmark ${HOST}-system workspace/
    # Setup Ramble & Spack
    - . workspace/setup.sh
    # Setup Workspace
    - cd ./workspace/${BENCHMARK}-benchmark/${HOST}-system/workspace/
    - ramble --workspace-dir . --disable-progress-bar --disable-logger workspace setup
    # Run Experiments
    - ramble --workspace-dir . --disable-progress-bar --disable-logger
      on --executor '{execute_experiment}' --where '{n_nodes} == 1'
    # Analyze Experiments
    - ramble --workspace-dir . --disable-progress-bar workspace analyze --format json yaml text
    # Check Experiment Exit Codes
    - cd -
    - python ./.gitlab/ci/bin/exit-codes ./workspace/${BENCHMARK}-benchmark/${HOST}-system/workspace/results.latest.json
