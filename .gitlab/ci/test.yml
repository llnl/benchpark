include:
  - local: .gitlab/ci/status.yml

workflow:
  auto_cancel:
    on_new_commit: conservative

.test_clusters: &test_clusters
  parallel:
    matrix:
      # - HOST: tioga
      #   ARCHCONFIG: llnl-elcapitan
      #   SCHEDULER_PARAMETERS: -N 1 -t 20m
      #   BENCHMARK: [amg2023, kripke, laghos]
      #   VARIANT: [+rocm]
      #   DASHBOARD_NAME: Tioga HPECray-zen3-MI250X-Slingshot [benchpark system init
      #     --dest=tioga-system llnl-elcapitan cluster=tioga]
      # - HOST: dane
      #   ARCHCONFIG: llnl-cluster
      #   SCHEDULER_PARAMETERS: -N 1 -t 00:20:00
      #   BENCHMARK: [hpl, hpcg, amg2023, kripke]
      #   VARIANT: [+openmp]
      #   DASHBOARD_NAME: Dane DELL-sapphirerapids-OmniPath [benchpark system init --dest=dane-system
      #     llnl-cluster cluster=dane]
      # - HOST: ruby
      #   ARCHCONFIG: llnl-cluster
      #   SCHEDULER_PARAMETERS: -N 1 -t 00:20:00
      #   BENCHMARK: [hpl, hpcg, amg2023, kripke]
      #   VARIANT: [+openmp]
      #   DASHBOARD_NAME: Ruby Supermicro-icelake-OmniPath [benchpark system init --dest=ruby-system
      #     llnl-cluster cluster=ruby]
      # - HOST: ruby
      #   ARCHCONFIG: llnl-cluster
      #   SCHEDULER_PARAMETERS: -N 1 -t 00:20:00
      #   BENCHMARK: [laghos]
      #   VARIANT: ['']
      #   DASHBOARD_NAME: Ruby Supermicro-icelake-OmniPath [benchpark system init --dest=ruby-system
      #     llnl-cluster cluster=ruby]
      - HOST: lassen
        ARCHCONFIG: llnl-sierra
        SCHEDULER_PARAMETERS: -nnodes 1 -W 20 -q pci  # ref: https://github.com/LLNL/radiuss-shared-ci/blob/main/customization/custom-jobs-and-variables.yml
        BENCHMARK: [kripke]
        VARIANT: [+cuda]
        DASHBOARD_NAME: Lassen IBM-power9-V100-Infiniband [benchpark system init --dest=lassen-system
          llnl-sierra]

workflow:
  auto_cancel:
    on_new_commit: conservative

limited_test_run:
  resource_group: $HOST
  stage: test
  tags: [$HOST, batch]
  <<:
    - *test_clusters
  rules:
    - if: '$TEST_TYPE != "Nightly"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/*
        - experiments/**
        - systems/$ARCHCONFIG/**
        - repo/$BENCHMARK/**
        - modifiers/**
        - var/**
        - lib/**
  before_script:
    - !reference [.report_status, before_script]
  script:
    - source ./.gitlab/ci/run-experiment.sh
  after_script:
    - !reference [.report_status, after_script]
