include:
  - local: .gitlab/utils/status.yml
  - local: .gitlab/utils/machine_checks.yml
  - local: .gitlab/utils/rules.yml
workflow:
  auto_cancel:
    on_new_commit: conservative
#############################
# Resource Allocation Section
#############################
.allocate_resources_flux:
  stage: allocate-resources
  when: on_success
  script:
    - set -x
    - flux --parent alloc ${SHARED_ALLOC} --job-name=${ALLOC_NAME}${GPUMODE} --bg
  after_script:
    - |
      if [[ "$CI_JOB_STATUS" == "canceled" ]]; then
        . .gitlab/utils/cancel-flux.sh
      fi
allocate_resources_tuolumne:
  extends: .allocate_resources_flux
  rules: !reference [.resource_rules_tuolumne, rules]
  parallel:
    matrix:
      - HOST: tuolumne
        SHARED_ALLOC: $TUOLUMNE_SHARED_ALLOC
        GPUMODE: SPX
  tags: [shell, tuolumne]
  needs: [tuolumne-up-check]
allocate_resources_tioga:
  extends: .allocate_resources_flux
  rules: !reference [.resource_rules_tioga, rules]
  variables:
    HOST: tioga
    SHARED_ALLOC: $TIOGA_SHARED_ALLOC
  tags: [shell, tioga]
  needs: [tioga-up-check]
##########################
# Resource Release Section
##########################
.release_resources_flux:
  stage: release-resources
  when: always
  # Do not cleanup dir yet
  script: [. .gitlab/utils/cancel-flux.sh --no-clean]
release_resources_flux_tuolumne:
  extends: .release_resources_flux
  rules: !reference [.resource_rules_tuolumne, rules]
  needs:
    - job: allocate_resources_tuolumne
    - job: run_tests_flux_tuolumne
      optional: true
  parallel:
    matrix:
      - HOST: tuolumne
        GPUMODE: SPX
  tags: [shell, tuolumne]
release_resources_flux_tioga:
  extends: .release_resources_flux
  rules: !reference [.resource_rules_tioga, rules]
  needs:
    - job: allocate_resources_tioga
    - job: run_tests_flux_tioga
      optional: true
  variables:
    HOST: tioga
  tags: [shell, tioga]
##################
# Test Run Section
##################
.run_tests_flux:
  stage: test
  extends: .run_test_rules
  variables:
    BASELINE_REF: develop
    BASELINE_EXCLUDED_PIPELINE_NAME: Nightly
  artifacts:
    when: always
    paths: ['artifact-githash/${HOST}/${BENCHMARK}/githash_metadata.json']
  before_script:
    - !reference [.report_status, before_script]
  script:
    - |
      ALLOC_ID=$(flux jobs --name="${ALLOC_NAME}${GPUMODE}" -n -o "{id}")
      echo -e "[Information]: Shared allocation ID = ${ALLOC_ID}"
      PROXY="$( [[ -n "${ALLOC_ID}" ]] && echo "flux proxy ${ALLOC_ID}" || echo "" )"
    - |
      pr_rc=0
      ${PROXY} flux watch $( ${PROXY} flux batch -o output.stdout.type=kvs ${FLUX_ARGS} .gitlab/utils/run-experiment.sh ) || pr_rc=$?
      echo "[PR Status]: PR checkout exit code = ${pr_rc}"
      printf '%s\n' "${pr_rc}" > "$CI_PROJECT_DIR/pr_flux.status"
      exit "${pr_rc}"
  after_script:
    - !reference [.report_status, after_script]
    - |
      pr_workspace="$CI_PROJECT_DIR/wkp/${HOST}/${BENCHMARK}/workspace"
      pr_json=$(find "${pr_workspace}/experiments" -type f -name 'githash_metadata.json' | sort | head -n 1)
      artifact_dir="$CI_PROJECT_DIR/artifact-githash/${HOST}/${BENCHMARK}"
      baseline_json="${artifact_dir}/baseline_githash_metadata.json"
      baseline_status_file="${artifact_dir}/baseline_job.status"
      mkdir -p "${artifact_dir}"
      if [[ -n "${pr_json}" ]]; then
        cp "${pr_json}" "${artifact_dir}/githash_metadata.json"
      else
        echo "Unable to locate PR githash metadata in ${pr_workspace}" >&2
        exit 1
      fi
      bash .gitlab/utils/fetch-githash-artifact.sh \
        "${BASELINE_REF}" \
        "${CI_JOB_NAME}" \
        "${HOST}" \
        "${BENCHMARK}" \
        "${baseline_json}" \
        "${CI_PIPELINE_ID}" \
        "${baseline_status_file}" \
        "${BASELINE_EXCLUDED_PIPELINE_NAME}"
      if [[ "$(cat "$CI_PROJECT_DIR/pr_flux.status")" == "0" ]]; then
        pr_status="PASSED"
      else
        pr_status="FAILED"
      fi
      case "$(cat "${baseline_status_file}")" in
        success)
          baseline_status="PASSED"
          ;;
        failed)
          baseline_status="FAILED"
          ;;
        canceled)
          baseline_status="CANCELED"
          ;;
        running)
          baseline_status="RUNNING"
          ;;
        pending)
          baseline_status="PENDING"
          ;;
        manual)
          baseline_status="MANUAL"
          ;;
        skipped)
          baseline_status="SKIPPED"
          ;;
        created)
          baseline_status="CREATED"
          ;;
        waiting_for_resource)
          baseline_status="WAITING_FOR_RESOURCE"
          ;;
        preparing)
          baseline_status="PREPARING"
          ;;
        scheduled)
          baseline_status="SCHEDULED"
          ;;
        *)
          baseline_status="$(cat "${baseline_status_file}" | tr '[:lower:]' '[:upper:]')"
          ;;
      esac
      echo -e "===============[TESTS]==============="
      echo "[Baseline]: ${baseline_status}"
      echo "[PR]: ${pr_status}"
      echo -e "====================================="
      bash .gitlab/utils/compare-githash-metadata.sh "${baseline_json}" "${pr_json}"
    - |
      if [[ "$CI_JOB_STATUS" == "canceled" ]]; then
        . .gitlab/utils/cancel-flux.sh
      fi
run_tests_flux_tuolumne:
  extends: .run_tests_flux
  tags: [shell, tuolumne]
  needs: [allocate_resources_tuolumne]
  parallel:
    matrix:
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK:
          - amg2023
          - branson
          - kripke
          - laghos
          - lammps
          - raja-perf
          - remhos
          - sparta-snl
        VARIANT: [+rocm]
        GPUMODE: SPX
      # Test openmp on tuolumne
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [kripke]
        VARIANT: [+openmp]
        GPUMODE: SPX
      # Test kripke+rocm+single_memory on tuolumne
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [kripke]
        VARIANT: [+rocm+single_memory]
        GPUMODE: SPX
      # Caliper profile.hip
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [kripke]
        VARIANT: ['+rocm caliper=mpi,time,rocm']
        GPUMODE: SPX
      # spack-pip
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [py-scaffold]
        VARIANT:
          - +rocm package_manager=spack-pip caliper=mpi,time allocation=torchrun-hpc
      # rocm7
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [raja-perf]
        VARIANT: ['+rocm caliper=time,rocm version=develop']
        SYSTEM_ARGS: [rocm=7.2.1]
        GPUMODE: SPX
      # Caliper services
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [kripke]
        VARIANT: [+rocm caliper_services=rocprofiler]
        GPUMODE: SPX
      # gcc
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [stream]
        SYSTEM_ARGS: [compiler=gcc]
run_tests_flux_tioga:
  extends: .run_tests_flux
  tags: [shell, tioga]
  needs: [allocate_resources_tioga]
  parallel:
    matrix:
      - HOST: tioga
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [amg2023, kripke, laghos, raja-perf, remhos]
        VARIANT: [+rocm]
      # spack-pip
      - HOST: tioga
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [py-scaffold]
        VARIANT:
          - +rocm package_manager=spack-pip caliper=mpi,time allocation=torchrun-hpc
