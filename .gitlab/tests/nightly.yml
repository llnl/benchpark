include:
  - local: .gitlab/utils/status.yml
  - local: .gitlab/utils/rules.yml
.test_clusters_nightly: &test_clusters_nightly
  variables:
    BASELINE_REF: develop
    DASHBOARD_NAME: Nightly [benchpark-develop]
    DANE_PARAMS: -N 1 -t 01:00:00 --exclusive --reservation=ci
    MATRIX_PARAMS: -N 1 -t 01:00:00 --exclusive
    ELCAP_PARAMS: -N 1 -t 60m --queue=pci --exclusive
  parallel:
    matrix:
      # MPI-only tests
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: $DANE_PARAMS
        BENCHMARK:
          - amg2023
          - gpcnet
          - hpcg
          - hpl
          - kripke
          - laghos
          - lammps
          - md-test
          - osu-micro-benchmarks
          - phloem
          - raja-perf
          - remhos
          - smb
          - sparta-snl
          - stream
      # salmon-tddft doesn't build with oneAPI, use gcc
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: $DANE_PARAMS
        SYSTEM_ARGS: [compiler=gcc]
        BENCHMARK: salmon-tddft
      # IOR needs a mount_point
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: $DANE_PARAMS
        SYSTEM_ARGS: [mount_point="/p/lustre1"]
        BENCHMARK: ior
      # +rocm tests
      - HOST: [tuolumne]
        ARCHCONFIG: llnl-elcapitan
        SCHEDULER_PARAMETERS: $ELCAP_PARAMS
        BENCHMARK:
          - amg2023
          - babelstream
          - branson
          - kripke
          - laghos
          - lammps
          - osu-micro-benchmarks
          - raja-perf
          - remhos
          - sparta-snl
        VARIANT: [+rocm]
      # +openmp tests
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: $DANE_PARAMS
        BENCHMARK:
          - amg2023
          - babelstream
          - branson
          - genesis
          - hpcg
          - hpl
          - kripke
          - lammps
          - raja-perf
        VARIANT: [+openmp]
      # qws/salmon-tddft don't build with oneAPI, use gcc
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: $DANE_PARAMS
        SYSTEM_ARGS: [compiler=gcc]
        BENCHMARK: [qws, salmon-tddft]
      # +cuda tests
      - HOST: matrix
        ARCHCONFIG: llnl-matrix
        SCHEDULER_PARAMETERS: $MATRIX_PARAMS
        BENCHMARK:
          - amg2023
          - babelstream
          - branson
          - gromacs
          - kripke
          - laghos
          - lammps
          - osu-micro-benchmarks
          - raja-perf
          - remhos
          - saxpy
        VARIANT: [+cuda]
      - HOST: matrix
        ARCHCONFIG: llnl-matrix
        SCHEDULER_PARAMETERS: $MATRIX_PARAMS
        BENCHMARK: [sparta-snl]
        VARIANT: [+cuda~gpu-aware-mpi]
      #############
      # Other tests
      #############
      # Test TPX, CPX modes on tuo
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        SCHEDULER_PARAMETERS: $ELCAP_PARAMS --setattr=gpumode=${GPUMODE} --conf=resource.rediscover=true
        BENCHMARK: [amg2023, kripke, laghos, raja-perf]
        VARIANT: [+rocm]
        GPUMODE: [TPX, CPX]
        SYSTEM_ARGS: [gpumode=$GPUMODE]
      # Test benchmark@develop
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: $DANE_PARAMS
        BENCHMARK: [amg2023, kripke, lammps, raja-perf, remhos, stream]
        BENCHMARK_VERSION: develop
      # Lammps workload=pace
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: $DANE_PARAMS
        BENCHMARK: [lammps]
        VARIANT: [workload=pace]
      - HOST: matrix
        ARCHCONFIG: llnl-matrix
        SCHEDULER_PARAMETERS: $MATRIX_PARAMS
        BENCHMARK: [lammps]
        VARIANT: [+cuda workload=pace]
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        SCHEDULER_PARAMETERS: $ELCAP_PARAMS
        BENCHMARK: [lammps]
        VARIANT: [+rocm workload=pace]
        GPUMODE: SPX
      # AMG2023 workload=problem2
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: $DANE_PARAMS
        BENCHMARK: [amg2023]
        VARIANT: [workload=problem2]
      - HOST: matrix
        ARCHCONFIG: llnl-matrix
        SCHEDULER_PARAMETERS: $MATRIX_PARAMS
        BENCHMARK: [amg2023]
        VARIANT: [+cuda workload=problem2]
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        SCHEDULER_PARAMETERS: $ELCAP_PARAMS
        BENCHMARK: [amg2023]
        VARIANT: [+rocm workload=problem2]
        GPUMODE: SPX
      # Rabbit test
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        SCHEDULER_PARAMETERS: $ELCAP_PARAMS -S dw=lustre_small
        BENCHMARK: [ior]
        SYSTEM_ARGS: [mount_point=rabbits_lustre_small]
nightly_test_run:
  extends: .nightly_rules
  interruptible: false
  resource_group: ${HOST}-${CI_PIPELINE_IID}
  stage: test
  tags: [$HOST, batch]
  <<: *test_clusters_nightly
  artifacts:
    when: always
    paths: ['artifact-githash/${HOST}/${BENCHMARK}/githash_metadata.json']
  before_script:
    - !reference [.report_status, before_script]
  script:
    - |
      nightly_rc=0
      ./.gitlab/utils/run-experiment.sh || nightly_rc=$?
      echo "[Nightly Status]: Nightly checkout exit code = ${nightly_rc}"
      printf '%s\n' "${nightly_rc}" > "$CI_PROJECT_DIR/nightly_run.status"
      exit "${nightly_rc}"
  after_script:
    - !reference [.report_status, after_script]
    - |-
      run_workspace="$CI_PROJECT_DIR/wkp/${HOST}/${BENCHMARK}/workspace"
      githash_json=$(find "${run_workspace}/experiments" -type f -name 'githash_metadata.json' | sort | head -n 1)
      artifact_dir="$CI_PROJECT_DIR/artifact-githash/${HOST}/${BENCHMARK}"
      baseline_json="${artifact_dir}/baseline_githash_metadata.json"
      baseline_status_file="${artifact_dir}/baseline_job.status"
      mkdir -p "${artifact_dir}"
      if [[ -n "${githash_json}" ]]; then
        cp "${githash_json}" "${artifact_dir}/githash_metadata.json"
      else
        echo "Unable to locate githash metadata in ${run_workspace}" >&2
        exit 1
      fi
      bash .gitlab/utils/fetch-githash-artifact.sh \
        "${BASELINE_REF}" \
        "${CI_JOB_NAME}" \
        "${HOST}" \
        "${BENCHMARK}" \
        "${baseline_json}" \
        "${CI_PIPELINE_ID}" \
        "${baseline_status_file}"
      if [[ "$(cat "$CI_PROJECT_DIR/nightly_run.status")" == "0" ]]; then
        nightly_status="PASSED"
      else
        nightly_status="FAILED"
      fi
      case "$(cat "${baseline_status_file}")" in
        success)
          baseline_status="PASSED"
          ;;
        failed)
          baseline_status="FAILED"
          ;;
        canceled)
          baseline_status="CANCELED"
          ;;
        running)
          baseline_status="RUNNING"
          ;;
        pending)
          baseline_status="PENDING"
          ;;
        manual)
          baseline_status="MANUAL"
          ;;
        skipped)
          baseline_status="SKIPPED"
          ;;
        created)
          baseline_status="CREATED"
          ;;
        waiting_for_resource)
          baseline_status="WAITING_FOR_RESOURCE"
          ;;
        preparing)
          baseline_status="PREPARING"
          ;;
        scheduled)
          baseline_status="SCHEDULED"
          ;;
        *)
          baseline_status="$(cat "${baseline_status_file}" | tr '[:lower:]' '[:upper:]')"
          ;;
      esac
      echo -e "===============[TESTS]==============="
      echo "[Baseline]: ${baseline_status}"
      echo "[Nightly]: ${nightly_status}"
      echo -e "====================================="
      bash .gitlab/utils/compare-githash-metadata.sh "${baseline_json}" "${githash_json}"
