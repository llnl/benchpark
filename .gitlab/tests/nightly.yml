include:
  - local: .gitlab/utils/status.yml
  #- local: .gitlab/utils/run-experiment.yml
.test_clusters_nightly: &test_clusters_nightly
  parallel:
    matrix:
      - HOST: tioga
        ARCHCONFIG: llnl-elcapitan
        SCHEDULER_PARAMETERS: -N 1 -t 60m --queue=pci --exclusive  # ref: https://github.com/LLNL/radiuss-shared-ci/blob/main/customization/custom-jobs-and-variables.yml
        BENCHMARK:
          - amg2023
          - babelstream
          - kripke
          - laghos
          - lammps
          - osu-micro-benchmarks
        VARIANT: [+rocm]
        SYSTEM_ARGS: ['']
        DASHBOARD_NAME: Nightly [benchpark-develop]
      - HOST: tuolumne
        ARCHCONFIG: llnl-elcapitan
        SCHEDULER_PARAMETERS: -N 1 -t 60m --queue=pci --exclusive
        BENCHMARK:
          - amg2023
          - babelstream
          - kripke
          - laghos
          - lammps
          - osu-micro-benchmarks
        VARIANT: [+rocm]
        SYSTEM_ARGS: [gpumode=SPX, gpumode=TPX, gpumode=CPX]
        DASHBOARD_NAME: Nightly [benchpark-develop]
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: -N 1 -t 01:00:00 --exclusive --reservation=ci
        BENCHMARK: [amg2023, babelstream, kripke, lammps]
        VARIANT: [+openmp]
        SYSTEM_ARGS: ['']
        DASHBOARD_NAME: Nightly [benchpark-develop]
      - HOST: dane
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: -N 1 -t 01:00:00 --exclusive --reservation=ci
        BENCHMARK:
          - amg2023
          - gpcnet
          - ior
          - kripke
          - laghos
          - osu-micro-benchmarks
          - phloem
          - remhos
          - phloem
          - smb
          - stream
        VARIANT: ['']  # MPI-only
        SYSTEM_ARGS: ['']
        DASHBOARD_NAME: Nightly [benchpark-develop]
      - HOST: lassen
        ARCHCONFIG: llnl-sierra
        SCHEDULER_PARAMETERS: -nnodes 1 -W 60 -q pci
        BENCHMARK:
          - amg2023
          - babelstream
          - kripke
          - lammps
          - osu-micro-benchmarks
        VARIANT: [+cuda]
        SYSTEM_ARGS: ['']
        DASHBOARD_NAME: Nightly [benchpark-develop]
nightly_test_run:
  resource_group: $HOST
  stage: test
  tags: [$HOST, batch]
  <<: *test_clusters_nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: never
  before_script:
    - !reference [.report_status, before_script]
  script:
    - !reference [.run_experiment, script]
  after_script:
    - !reference [.report_status, after_script]
