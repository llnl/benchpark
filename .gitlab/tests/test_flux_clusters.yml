include:
  - local: .gitlab/utils/status.yml
  - local: .gitlab/utils/machine_checks.yml
  - local: .gitlab/utils/rules.yml
workflow:
  auto_cancel:
    on_new_commit: conservative
#############################
# Resource Allocation Section
#############################
.allocate_resources_flux:
  extends: .on_host_template
  stage: allocate-resources
  script:
    - set -x
    - flux --parent alloc ${SHARED_ALLOC} --job-name=${ALLOC_NAME}${GPUMODE} --bg
  after_script:
    - |
      if [[ "$CI_JOB_STATUS" == "canceled" ]]; then
        . .gitlab/utils/cancel-flux.sh
      fi
allocate_resources_tioga:
  extends: .allocate_resources_flux
  variables:
    HOST: tioga
    SHARED_ALLOC: $TIOGA_SHARED_ALLOC
  tags: [shell, tioga]
  needs: [tioga-up-check]
##########################
# Resource Release Section
##########################
.release_resources_flux:
  extends: .on_host_template
  stage: release-resources
  # Do not cleanup dir yet
  script: [. .gitlab/utils/cancel-flux.sh --no-clean]
release_resources_flux_tioga:
  extends: .release_resources_flux
  needs: [allocate_resources_tioga, run_tests_flux_tioga]
  variables:
    HOST: tioga
  tags: [shell, tioga]
##################
# Test Run Section
##################
.run_tests_flux:
  stage: test
  extends: .on_host_template
  variables:
    BASELINE_REF: ci-with-githash
  artifacts:
    when: always
    paths:
      - artifact-githash/${HOST}/${BENCHMARK}/githash_metadata.json
  before_script:
    - !reference [.report_status, before_script]
  script:
    - |
      ALLOC_ID=$(flux jobs --name="${ALLOC_NAME}${GPUMODE}" -n -o "{id}")
      echo -e "[Information]: Shared allocation ID = ${ALLOC_ID}"
      PROXY="$( [[ -n "${ALLOC_ID}" ]] && echo "flux proxy ${ALLOC_ID}" || echo "" )"
    - |
      pr_rc=0
      # develop_rc=0

      ${PROXY} flux watch $( ${PROXY} flux batch -o output.stdout.type=kvs ${FLUX_ARGS} .gitlab/utils/run-experiment.sh ) || pr_rc=$?

      # git fetch origin develop
      # git worktree add "$CI_PROJECT_DIR/d" origin/develop
      # cd "$CI_PROJECT_DIR/d"

      # ${PROXY} flux watch $( ${PROXY} flux batch -o output.stdout.type=kvs ${FLUX_ARGS} .gitlab/utils/run-experiment.sh ) || develop_rc=$?

      echo "[PR Status]: PR checkout exit code = ${pr_rc}"
      # echo "[Develop Status]: develop checkout exit code = ${develop_rc}"
      printf '%s\n' "${pr_rc}" > "$CI_PROJECT_DIR/pr_flux.status"
      # printf '%s\n' "${develop_rc}" > "$CI_PROJECT_DIR/develop_flux.status"

      exit "${pr_rc}"
  after_script:
    - !reference [.report_status, after_script]
    - |
      if [[ "$(cat "$CI_PROJECT_DIR/pr_flux.status")" == "0" ]]; then
        pr_status="PASSED"
      else
        pr_status="FAILED"
      fi

      # if [[ "$(cat "$CI_PROJECT_DIR/develop_flux.status")" == "0" ]]; then
      #   develop_status="PASSED"
      # else
      #   develop_status="FAILED"
      # fi

      echo -e "===============[TESTS]==============="
      # echo "[Develop]: ${develop_status}"
      echo "[PR]: ${pr_status}"
      echo -e "====================================="
    - |
      pr_workspace="$CI_PROJECT_DIR/wkp/${HOST}/${BENCHMARK}/workspace"
      # develop_workspace="$CI_PROJECT_DIR/d/wkp/${HOST}/${BENCHMARK}/workspace"
      pr_json=$(find "${pr_workspace}/experiments/${BENCHMARK}" -type f -name 'githash_metadata.json' | sort | head -n 1)
      artifact_dir="$CI_PROJECT_DIR/artifact-githash/${HOST}/${BENCHMARK}"
      artifact_relpath="artifact-githash/${HOST}/${BENCHMARK}/githash_metadata.json"
      baseline_json="${artifact_dir}/baseline_githash_metadata.json"
      mkdir -p "${artifact_dir}"
      if [[ -n "${pr_json}" ]]; then
        cp "${pr_json}" "${artifact_dir}/githash_metadata.json"
      else
        echo "Unable to locate PR githash metadata in ${pr_workspace}" >&2
        exit 1
      fi
      baseline_pipeline_id=$(
        curl --silent --show-error --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines?ref=${BASELINE_REF}&order_by=id&sort=desc&per_page=20" \
        | jq -r --arg current_pipeline_id "${CI_PIPELINE_ID}" '.[] | select((.id | tostring) != $current_pipeline_id) | .id' \
        | head -n 1
      )
      if [[ -z "${baseline_pipeline_id}" ]]; then
        echo "Unable to locate a prior pipeline for ref ${BASELINE_REF}" >&2
        exit 1
      fi
      baseline_job_id=$(
        curl --silent --show-error --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${baseline_pipeline_id}/jobs?per_page=100" \
        | jq -r --arg job_name "${CI_JOB_NAME}" '.[] | select(.name == $job_name and (.artifacts_file.filename // "") != "") | .id' \
        | head -n 1
      )
      if [[ -z "${baseline_job_id}" ]]; then
        echo "Unable to locate job ${CI_JOB_NAME} with artifacts in pipeline ${baseline_pipeline_id}" >&2
        exit 1
      fi
      curl --location --silent --show-error --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${baseline_job_id}/artifacts/${artifact_relpath}" \
        --output "${baseline_json}"
      bash .gitlab/utils/compare-githash-metadata.sh "${baseline_json}" "${pr_json}"
      # relative_json="${pr_json#${pr_workspace}/}"
      # develop_json="${develop_workspace}/${relative_json}"
      # bash .gitlab/utils/compare-githash-metadata.sh "$pr_json" "$develop_json"
    - |
      if [[ "$CI_JOB_STATUS" == "canceled" ]]; then
        . .gitlab/utils/cancel-flux.sh
      fi
run_tests_flux_tioga:
  extends: .run_tests_flux
  tags: [shell, tioga]
  needs: [allocate_resources_tioga]
  parallel:
    matrix:
      - HOST: tioga
        ARCHCONFIG: llnl-elcapitan
        BENCHMARK: [stream]
