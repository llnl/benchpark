include:
  - local: .gitlab/utils/status.yml
  - local: .gitlab/utils/run-experiment.yml
workflow:
  auto_cancel:
    on_new_commit: conservative

stages:
  - allocate-resources
  - test
  - release-resources

.on_ruby:
  tags:
    - shell
    - ruby
  rules:
    # Runs except if we explicitly deactivate ruby by variable.
    - if: '$ON_RUBY == "OFF"'
      when: never
    # Advanced jobs can only run on master, develop or if ALL_TARGETS is ON.
    # Set ADVANCED_JOB to ON in the job definition to make it an advanced job.
    - if: '$ADVANCED_JOB == "ON" && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "develop" && $ALL_TARGETS != "ON"'
      when: never
    # We should always release resources allocated in the pipeline.
    - if: '$CI_JOB_NAME =~ /release_resources/'
      when: always
    # A true statement is expected to allow jobs to run. Here is the default.
    - when: on_success

allocate_resources:
  variables:
    GIT_STRATEGY: none
  extends: .on_ruby
  stage: allocate-resources
  script:
    - salloc ${SCHEDULER_PARAMETERS} --no-shell --job-name=${ALLOC_NAME}

release_resources:
  variables:
    GIT_STRATEGY: none
  extends: .on_ruby
  stage: release-resources
  script:
    - export JOBID=$(squeue -h --name=${ALLOC_NAME} --format=%A)
    - ([[ -n "${JOBID}" ]] && scancel ${JOBID} || exit 0)

.test_clusters: &test_clusters
  parallel:
    matrix:
      # - HOST: tioga
      #   ARCHCONFIG: llnl-elcapitan
      #   SCHEDULER_PARAMETERS: -N 1 -t 20m --queue=pci --exclusive  # ref: https://github.com/LLNL/radiuss-shared-ci/blob/main/customization/custom-jobs-and-variables.yml
      #   BENCHMARK: [amg2023, kripke, laghos]
      #   VARIANT: [+rocm]
      #   DASHBOARD_NAME: Tioga HPECray-zen3-MI250X-Slingshot [benchpark system init
      #     --dest=tioga-system llnl-elcapitan cluster=tioga]
      # - HOST: dane
      #   ARCHCONFIG: llnl-cluster
      #   SCHEDULER_PARAMETERS: -N 1 -t 00:20:00 --exclusive --reservation=ci
      #   BENCHMARK: [hpl, hpcg, amg2023, kripke]
      #   VARIANT: [+openmp]
      #   DASHBOARD_NAME: Dane DELL-sapphirerapids-OmniPath [benchpark system init --dest=dane-system
      #     llnl-cluster cluster=dane]
      - HOST: ruby
        ARCHCONFIG: llnl-cluster
        SCHEDULER_PARAMETERS: -N 1 -t 00:20:00 --exclusive --reservation=ci
        BENCHMARK: [laghos, stream]
        VARIANT: ['']  # MPI-only test
        DASHBOARD_NAME: Ruby Supermicro-icelake-OmniPath [benchpark system init --dest=ruby-system
          llnl-cluster cluster=ruby]
        ALLOC_NAME: ${CI_PROJECT_NAME}_ci_${CI_PIPELINE_ID}
      # - HOST: lassen
      #   ARCHCONFIG: llnl-sierra
      #   SCHEDULER_PARAMETERS: -nnodes 1 -W 20 -q pci
      #   BENCHMARK: [kripke]
      #   VARIANT: [+cuda]
      #   DASHBOARD_NAME: Lassen IBM-power9-V100-Infiniband [benchpark system init --dest=lassen-system
      #     llnl-sierra]
limited_test_run:
  resource_group: $HOST
  stage: test
  tags: [$HOST, batch]
  <<: *test_clusters
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - .gitlab-ci.yml
        - .gitlab/**
        - experiments/**
        - systems/$ARCHCONFIG/**
        - repo/$BENCHMARK/**
        - modifiers/**
        - var/**
        - lib/**
  before_script:
    - !reference [.report_status, before_script]
  script:
    - !reference [.run_experiment, script]
  after_script:
    - !reference [.report_status, after_script]

.run_experiment:
  script:
    - echo -e run-experiment.sh | xargs srun $( [[ -n "${JOBID}" ]] && echo "--jobid=${JOBID}" ) --reservation=ci --nodes=1
