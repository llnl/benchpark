ramble:
  include:
  - ./configs/software.yaml
  - ./configs/variables.yaml
  - ./configs/modifier.yaml

  config:
    deprecated: true
    spack_flags:
      install: '--add --keep-stage'
      concretize: '-U -f'

  modifiers:
  - name: allocation

  applications:
    kripke:
      workloads:
        kripke:
          env_vars:
          variables:
            experiment_setup: ''
            n_ranks: '{npx}*{npy}*{npz}'
            n_threads_per_proc: '1'
            omp_num_threads: '{n_threads_per_proc}'
            arch: 'OpenMP'
          experiments:
            kripke_openmp_strong_{n_nodes}_{n_ranks}_{omp_num_threads}_{ngroups}_{gs}_{nquad}_{ds}_{lorder}_{nzx}_{nzy}_{nzz}_{npx}_{npy}_{npz}:
              variants:
                package_manager: spack
              variables:
                ngroups: 64
                gs: 1
                nquad: 128
                ds: 128
                lorder: 4
                nzx: '64'
                nzy: '64'
                nzz: '32'
                npx: ['2', '2', '4', '4']
                npy: ['2', '2', '2', '4']
                npz: ['1', '2', '2', '2']
            kripke_openmp_weak_{n_nodes}_{n_ranks}_{omp_num_threads}_{ngroups}_{gs}_{nquad}_{ds}_{lorder}_{nzx}_{nzy}_{nzz}_{npx}_{npy}_{npz}:
              variants:
                package_manager: spack
              variables:
                ngroups: 64
                gs: 1
                nquad: 128
                ds: 128
                lorder: 4
                nzx: ['128', '128', '256', '256']
                nzy: ['128', '128', '128', '256']
                nzz: ['64', '128', '128', '128']
                npx: ['4', '8', '8', '8',]
                npy: ['4', '4', '8', '8']
                npz: ['4', '4', '4', '8']
                n_nodes: ['1','2','4', '8']
  software:
    packages:
      kripke:
        pkg_spec: kripke@comm_cali +mpi+openmp{modifier_spack_variant} ^chai@2024.02
        compiler: default-compiler
    environments:
      kripke:
        packages:
        - default-mpi
        - kripke
        - '{modifier_package_name}'
