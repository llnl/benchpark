ramble:
  include:
  - ./configs/software.yaml
  - ./configs/variables.yaml
  - ./configs/modifier.yaml

  config:
    deprecated: true
    spack_flags:
      install: '--add --keep-stage'
      concretize: '-U -f'

  modifiers:
  - name: allocation

  applications:
    amg2023:
      workloads:
        problem1:
          experiments:
            'amg2023_cuda_throughput_problem1_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: '2'
                py: '2'
                pz: '2'
                nx: ['120', '240', '240']
                ny: ['120', '120', '240']
                nz: ['120', '120', '120']
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_strong_problem1_120_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['1', '2', '2', '4']
                nx: ['60', '30','30', '30']
                ny: ['60', '60', '30', '30']
                nz: ['60', '60', '60', '30']
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_strong_problem1_160_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['2', '2', '2', '4']
                nx: ['80', '40','40', '40']
                ny: ['80', '80', '40', '40']
                nz: ['80', '80', '80', '40']
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_strong_problem1_200_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['2', '2', '2', '4']
                nx: ['100', '50','50', '50']
                ny: ['100', '100', '50', '50']
                nz: ['100', '100', '100', '50']
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_weak_60_problem1_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['2', '2', '2', '4']
                nx: '60'
                ny: '60'
                nz: '60'
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_weak_40_problem1_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['2', '2', '2', '4']
                nx: '40'
                ny: '40'
                nz: '40'
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'

        problem2:
          experiments:
            'amg2023_cuda_throughput_problem2_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: '2'
                py: '2'
                pz: '2'
                nx: ['120', '240', '240', '240']
                ny: ['120', '120', '240', '240']
                nz: ['120', '120', '120', '240']
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_strong_problem2_200_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['2', '2', '2', '4']
                nx: ['100', '50','50', '50']
                ny: ['100', '100', '50', '50']
                nz: ['100', '100', '100', '50']
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_strong_problem2_256_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['2', '2', '2', '4']
                nx: ['128', '64','64', '64']
                ny: ['128', '128', '64', '64']
                nz: ['128', '128', '128', '64']
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_strong_problem2_320_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['2', '2', '2', '4']
                nx: ['160', '80','80', '80']
                ny: ['160', '160', '80', '80']
                nz: ['160', '160', '160', '80']
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_weak_80_problem2_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['2', '2', '2', '4']
                nx: '80'
                ny: '80'
                nz: '80'
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
            'amg2023_cuda_weak_60_problem2_{px}_{py}_{pz}_{nx}_{ny}_{nz}':
              variants:
                package_manager: spack
              variables:
                px: ['2', '4', '4', '4']
                py: ['2', '2', '4', '4']
                pz: ['2', '2', '2', '4']
                nx: '60'
                ny: '60'
                nz: '60'
                env_name: 'amg2023'
                n_gpus: '{px}*{py}*{pz}'
  software:
    packages:
      cuda:
        pkg_spec: cuda@{default_cuda_version}+allow-unsupported-compilers
        compiler: default-compiler
      hypre:
        pkg_spec: hypre@3.1_comm_cali +mpi+cuda+mixedint~fortran{modifier_spack_variant} cuda_arch=={cuda_arch}
        compiler: default-compiler
      amg2023:
        pkg_spec: amg2023@develop +mpi+cuda{modifier_spack_variant} cuda_arch=={cuda_arch}
        compiler: default-compiler
    environments:
      amg2023:
        packages:
        - cuda
        - cublas-cuda
        - lapack
        - default-mpi
        - hypre
        - amg2023
        - '{modifier_package_name}'
