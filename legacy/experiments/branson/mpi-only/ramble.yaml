ramble:
  applications:
    branson:
      workloads:
        branson:
          experiments:
            branson_branson_weak_scaling_caliper_time_mpi_{n_nodes}_{num_particles}_{n_ranks}:
              exclude: {}
              matrix: []
              variables:
                n_nodes:
                - 1
                - 2
                - 4
                - 8
                n_ranks: '{n_nodes}*{sys_cores_per_node}'
                num_particles:
                - 850000000
                - 1700000000
                - 3400000000
                - 6800000000
              variants:
                package_manager: spack
              zips: {}
  config:
    deprecated: true
    spack_flags:
      concretize: -U -f
      install: --add --keep-stage
  include:
  - ./configs
  modifiers:
  - name: allocation
  - mode: mpi
    name: caliper
  - mode: time
    name: caliper
  software:
    environments:
      branson:
        packages:
        - caliper
        - default-mpi
        - branson
    packages:
      branson:
        compiler: default-compiler
        pkg_spec: branson@develop+caliper
      caliper:
        compiler: default-compiler
        pkg_spec: caliper@master+adiak+mpi~libunwind~libdw~papi
